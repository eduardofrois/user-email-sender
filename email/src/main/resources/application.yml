spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/ms_email_ms}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
    ddl-auto: update
    show-sql: true
    properties:
      hibernate:
      dialect: org.hibernate.dialect.PostgreSQLDialect

  rabbitmq:
    addresses: ${SPRING_RABBITMQ_ADDRESSES:amqp://localhost:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    virtual-host: ${SPRING_RABBITMQ_VIRTUAL_HOST:/}

  flyway:
      enabled: true
      locations: classpath:db/migration
      baseline-on-migrate: true

  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:change-me@example.com}
    password: ${SPRING_MAIL_PASSWORD:change-me}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true


server:
  port: 8080

app:
  rabbitmq:
    exchanges:
      email-dead-letter: ${APP_RABBITMQ_EXCHANGES_EMAILDEADLETTER:email-dlx}
    queues:
      email-notification: ${APP_RABBITMQ_QUEUES_EMAILNOTIFICATION:email-queue}
      email-dead-letter: ${APP_RABBITMQ_QUEUES_EMAILDEADLETTER:email-dlq}
      simulated-delay: ${APP_RABBITMQ_QUEUES_SIMULATEDDELAY:simulated-delay-queue}
    retry:
      max-attempts: ${APP_RABBITMQ_RETRY_MAXATTEMPTS:3}
      initial-interval: ${APP_RABBITMQ_RETRY_INITIALINTERVAL:2000}
      multiplier: ${APP_RABBITMQ_RETRY_MULTIPLIER:2.0}
      max-interval: ${APP_RABBITMQ_RETRY_MAXINTERVAL:10000}
